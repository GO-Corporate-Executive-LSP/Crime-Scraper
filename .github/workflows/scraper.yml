name: Daily Crime Data Scraper

concurrency:
  group: crime-news-metadata-refresh
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # Allow pushing scraped data back to repo

jobs:
  scrape-crime-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper git operations
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm
          
      - name: Record current collection window
        run: echo "COLLECTION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run crime data scraper
        run: |
          python main.py --mode full
        env:
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}

      - name: Export current-run metadata only
        run: python scripts/export_news_metadata.py --input data/crime_articles.csv --output metadata/news-metadata.json --started-at "$COLLECTION_STARTED_AT"
          
      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain -- metadata/news-metadata.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- metadata/news-metadata.json
          git commit -m "Refresh bounded current-run news metadata"
          git push
