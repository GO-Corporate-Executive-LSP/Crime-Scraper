name: News metadata contract
on:
  pull_request:
permissions:
  contents: read
jobs:
  metadata-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_export_news_metadata.py'
